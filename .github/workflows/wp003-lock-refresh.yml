name: WP003 Lockfile Refresh TEMP

on:
  push:
    branches:
      - feature/wp-003-postgresql-migration-engine

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch for controlled lockfile regeneration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup governed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Regenerate npm lockfile with npm 11.19.0
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Commit regenerated lockfile only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(database): [WP-003] refresh lockfile [lock-refresh-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}

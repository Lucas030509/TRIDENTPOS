name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pre-compile TruffleHog secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          version: '3.97.4'
          extra_args: --results=verified,unverified

      - name: Pre-compile Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: 'trivy.yaml'
          version: 'v0.74.0'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Setup Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Deterministic dependency install
        run: npm ci

      - name: Check architecture graph dependency constraints
        run: npm run graph:check

      - name: Build monorepo packages
        run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Deterministic dependency install
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Lint codebase
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Deterministic dependency install
        run: npm ci

      - name: Strict TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tridentpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tridentpos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Deterministic dependency install
        run: npm ci

      - name: Configure and verify Linux chrome-sandbox for Electron
        run: |
          # 1. Force Electron binary download and extraction prior to sandbox configuration
          node -e "require('electron')" || true

          SANDBOX_PATH=$(node -e "
            const p = require('electron');
            const path = require('node:path');
            const bin = typeof p === 'string' ? p : (p.default || p);
            console.log(path.join(path.dirname(bin), 'chrome-sandbox'));
          ")

          echo "Configuring Linux chrome-sandbox at: $SANDBOX_PATH"
          if [ ! -f "$SANDBOX_PATH" ]; then
            echo "FATAL: chrome-sandbox binary missing at $SANDBOX_PATH"
            exit 1
          fi

          sudo chown root:root "$SANDBOX_PATH"
          sudo chmod 4755 "$SANDBOX_PATH"

          # 2. Diagnostic stat display
          stat "$SANDBOX_PATH"

          # 3. Deterministic verification: fail closed if root ownership or SUID bit is missing
          node -e "
            const fs = require('node:fs');
            const stat = fs.statSync('$SANDBOX_PATH');
            const isRoot = stat.uid === 0;
            const hasSuid = (stat.mode & 0o4000) !== 0;
            const isExecutable = (stat.mode & 0o111) !== 0;
            console.log('chrome-sandbox diagnostics: UID=' + stat.uid + ', mode=' + (stat.mode & 0o7777).toString(8));
            if (!isRoot) {
              console.error('FATAL: chrome-sandbox is not owned by root (UID=' + stat.uid + ').');
              process.exit(1);
            }
            if (!hasSuid) {
              console.error('FATAL: chrome-sandbox lacks SUID bit (mode=' + (stat.mode & 0o7777).toString(8) + ').');
              process.exit(1);
            }
            if (!isExecutable) {
              console.error('FATAL: chrome-sandbox lacks executable bit.');
              process.exit(1);
            }
            console.log('SUCCESS: chrome-sandbox verified with root ownership and mode 4755.');
          "

      - name: Run unit test suites and actual Electron runtime validation
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tridentpos_test

name: WP003 Format Refresh TEMP

on:
  push:
    branches:
      - feature/wp-003-postgresql-migration-engine

permissions:
  contents: write

jobs:
  format-two-files:
    if: ${{ !contains(github.event.head_commit.message, '[format-refresh-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch for controlled formatting
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup governed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Deterministic dependency install
        run: npm ci --ignore-scripts

      - name: Format only audited WP-003 TypeScript files
        run: npx prettier --write packages/database/src/index.test.ts packages/database/src/runner.ts

      - name: Verify only authorized files changed and commit
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(packages/database/src/index\.test\.ts|packages/database/src/runner\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatting drift:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- packages/database/src/index.test.ts packages/database/src/runner.ts; then
            echo "Files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/index.test.ts packages/database/src/runner.ts
          git commit -m "style(database): [WP-003] apply governed Prettier formatting [format-refresh-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
